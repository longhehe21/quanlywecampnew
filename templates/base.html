<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản Lý Kho Wecamp Long Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; background: #f8f9fa; }
        .nav-tabs .nav-link { font-weight: 600; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="/">Quản lý kho Wecamp</a>
            <div class="text-light opacity-75 ms-2" style="font-size: 0.75rem; letter-spacing: 1px;">
                <em>by Long Đẹp Trai © 2003</em>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- 3 TAB CHÍNH -->
        <ul class="nav nav-tabs mb-4" id="mainTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fs-5" id="tab1-tab" data-bs-toggle="tab"
                        data-bs-target="#tab1" type="button">
                    1. DỮ LIỆU GỐC
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fs-5" id="tab2-tab" data-bs-toggle="tab"
                        data-bs-target="#tab2" type="button">
                    2. TỒN KHO
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link fs-5" id="tab3-tab" data-bs-toggle="tab"
                        data-bs-target="#tab3" type="button">
                    3. FABI & BÁO CÁO
                </button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="tab1">
                {% include "tab1.html" %}
            </div>
            <div class="tab-pane fade" id="tab2">
                {% include "tab2.html" %}
            </div>
            <div class="tab-pane fade" id="tab3">
                {% include "tab3.html" %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
